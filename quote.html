<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FILM HK RENTAL · 견적 장바구니</title>
<meta name="description" content="필요한 장비를 담고 대여 날짜를 고르면, 확인 후 가능 여부와 견적을 안내해 드려요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F6F6F4;--card:#FFFFFF;--line:#E4E4E0;--ink:#141416;--sub:#5F6470;--mute:#8A8F99;--acc:#F5C518;--acc-ink:#141416;--ok:#15803D;--warn:#B45309;--bad:#B91C1C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:20;background:rgba(246,246,244,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex:0 0 auto}
.brand b{display:block;font-size:15px;font-weight:900;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--sub)}
h1{font-size:24px;font-weight:900;letter-spacing:-.02em;margin:22px 0 6px}
.lead{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.step{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;margin:0 0 12px}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--sub)}
.field input,.field select,.field textarea{height:46px;border-radius:12px;border:1px solid var(--line);background:#FBFBFA;padding:0 12px;font-size:15px;color:var(--ink);font-weight:500;width:100%}
.field textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.dt{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:6px}
.billnote{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FFF8DB;color:#7A5B00;font-size:13px;font-weight:700}
.billnote.bad{background:#FDECEC;color:var(--bad)}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#FBFBFA;color:var(--mute);margin-bottom:10px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cat{font-size:12px;font-weight:900;color:var(--mute);margin:14px 2px 6px}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #EFEFEC}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.item .nm span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.qty{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.qty button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:900;cursor:pointer;line-height:1}
.qty button:disabled{opacity:.35;cursor:default}
.qty output{min-width:28px;text-align:center;font-weight:900;font-size:15px}
.add{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--ink);background:#fff;font-weight:900;font-size:13.5px;cursor:pointer;flex:0 0 auto}
.empty{color:var(--mute);font-size:14px;padding:20px 4px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;min-width:0}
.bar .sum small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.bar .sum b{display:block;font-size:19px;font-weight:900}
.cta{height:52px;padding:0 22px;border-radius:15px;border:0;background:var(--acc);color:var(--acc-ink);font-size:15.5px;font-weight:900;cursor:pointer;white-space:nowrap}
.cta:disabled{background:#E6E6E2;color:#9A9EA6;cursor:default}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.45);display:none;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:720px;max-height:92dvh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.grip{width:40px;height:5px;border-radius:5px;background:#D9D9D4;margin:4px auto 12px}
.sheet h2{font-size:19px;font-weight:900;margin:0 0 4px}
.sheet .sub{font-size:13px;color:var(--sub);margin:0 0 14px}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid #F0F0EC}
.line span:last-child{font-weight:700;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;font-weight:900}
.total b{font-size:21px}
.note{font-size:12px;color:var(--mute);line-height:1.6;margin:4px 0 14px}
.form{display:grid;gap:10px;margin-top:6px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--sub);line-height:1.55;padding:12px;border-radius:12px;background:#F7F7F5;border:1px solid var(--line)}
.consent input{width:20px;height:20px;margin:1px 0 0;accent-color:#141416;flex:0 0 auto}
.err{color:var(--bad);font-size:13px;font-weight:700;min-height:18px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding:40px 10px}
.done .big{width:64px;height:64px;border-radius:50%;background:#E9F7EE;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.done h2{font-size:21px;font-weight:900;margin:0 0 8px}
.done p{color:var(--sub);font-size:14px;line-height:1.7;margin:0 0 18px}
.ghost{height:46px;padding:0 18px;border-radius:13px;border:1px solid var(--line);background:#fff;font-weight:800;cursor:pointer}
footer{max-width:720px;margin:10px auto 0;padding:0 16px 20px;color:var(--mute);font-size:12px;line-height:1.7}
@media (max-width:420px){.dates{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="in"><div class="logo">HK</div><div class="brand"><b>FILM HK RENTAL</b><span>견적 장바구니</span></div></div></header>

<main class="wrap" id="app">
  <h1>필요한 장비를 담아 주세요</h1>
  <p class="lead">대여 날짜와 장비를 골라 신청하시면, 일정을 확인한 뒤 <b>가능 여부와 최종 견적</b>을 연락드려요. 신청만으로는 예약이 확정되지 않아요.</p>

  <section class="card" aria-labelledby="s1">
    <div class="step" id="s1"><i>1</i>대여 날짜</div>
    <div class="dates">
      <div class="field">시작
        <div class="dt"><input type="date" id="sD" aria-label="시작 날짜"><select id="sT" aria-label="시작 시간"></select></div>
      </div>
      <div class="field">반납
        <div class="dt"><input type="date" id="eD" aria-label="반납 날짜"><select id="eT" aria-label="반납 시간"></select></div>
      </div>
    </div>
    <div class="billnote" id="billNote"></div>
  </section>

  <section class="card" aria-labelledby="s2">
    <div class="step" id="s2"><i>2</i>장비 담기</div>
    <label class="search"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="장비 이름으로 찾기" aria-label="장비 검색"></label>
    <div class="chips" id="chips"></div>
    <div id="list"><div class="empty">장비 목록을 불러오는 중…</div></div>
  </section>
</main>

<footer id="foot"></footer>

<div class="bar"><div class="in">
  <div class="sum"><small id="barCount">담은 장비 0개</small><b id="barTotal">0원</b></div>
  <button class="cta" id="openCart" type="button" disabled>견적 신청하기</button>
</div></div>

<div class="sheet-bg" id="cartBg" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
  <div class="sheet" id="sheet">
    <div class="grip" aria-hidden="true"></div>
    <div id="cartBody"></div>
  </div>
</div>

<script>
(function(){
  const SUPABASE_URL='https://bnyjrobeiiqgavhgiimx.supabase.co';
  const SUPABASE_KEY='sb_publishable_CGDh6TxaWKvUjx4inv2LmA_BK4cWR_W';
  const CATALOG_ID='filmhk-catalog-v1';
  const CART_KEY='fhk_quote_cart_v1';
  const $=id=>document.getElementById(id);
  const H=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const won=n=>(Math.round(n)||0).toLocaleString('ko-KR')+'원';
  const WD=['일','월','화','수','목','금','토'];
  let client=null; try{ client=window.supabase&&window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}}); }catch(_){}

  let catalog=null, cat='전체', query='';
  let cart={}; try{ cart=JSON.parse(localStorage.getItem(CART_KEY)||'{}')||{}; }catch(_){ cart={}; }
  const saveCart=()=>{ try{ localStorage.setItem(CART_KEY,JSON.stringify(cart)); }catch(_){} };

  /* ---------- 날짜 ---------- */
  const pad=n=>String(n).padStart(2,'0');
  const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  function fillTimes(sel,def){ let h=''; for(let i=0;i<48;i++){ const t=`${pad(Math.floor(i/2))}:${i%2?'30':'00'}`; h+=`<option${t===def?' selected':''}>${t}</option>`; } sel.innerHTML=h; }
  const tm=new Date(); tm.setDate(tm.getDate()+1);
  const tm2=new Date(tm); tm2.setDate(tm2.getDate()+1);
  $('sD').value=ymd(tm); $('eD').value=ymd(tm2); $('sD').min=ymd(new Date()); $('eD').min=ymd(new Date());
  fillTimes($('sT'),'10:00'); fillTimes($('eT'),'10:00');
  function ms(){ return new Date(`${$('eD').value}T${$('eT').value}`)-new Date(`${$('sD').value}T${$('sT').value}`); }
  function billDays(){ const m=ms(); return isNaN(m)?0:Math.max(1,Math.ceil(m/86400000)); }
  function fmt(d,t){ if(!d) return ''; const [y,m,dd]=d.split('-').map(Number); return `${m}/${dd}(${WD[new Date(y,m-1,dd).getDay()]}) ${t}`; }
  function datesOk(){ const m=ms(); return !isNaN(m)&&m>0; }
  function renderDates(){
    const n=$('billNote');
    if(!$('sD').value||!$('eD').value){ n.className='billnote bad'; n.textContent='날짜를 골라 주세요.'; }
    else if(!datesOk()){ n.className='billnote bad'; n.textContent='반납 시간이 시작보다 늦어야 해요.'; }
    else { const h=Math.round(ms()/3600000); n.className='billnote'; n.textContent=`${fmt($('sD').value,$('sT').value)} → ${fmt($('eD').value,$('eT').value)} · ${h}시간 · 청구 ${billDays()}일 기준`; }
    renderBar();
  }
  ['sD','sT','eD','eT'].forEach(id=>$(id).addEventListener('change',()=>{
    if(id==='sD'&&$('eD').value<$('sD').value){ $('eD').value=$('sD').value; }
    $('eD').min=$('sD').value||ymd(new Date());
    renderDates();
  }));

  /* ---------- 장비 목록 ---------- */
  function allModels(){ return catalog?catalog.categories.flatMap(c=>c.models.map(m=>Object.assign({category:c.name},m))):[]; }
  const keyOf=m=>m.category+'|'+m.name;
  function renderChips(){
    const cats=['전체'].concat(catalog?catalog.categories.map(c=>c.name):[]);
    $('chips').innerHTML=cats.map(c=>`<button type="button" class="chip${c===cat?' on':''}" data-cat="${H(c)}">${H(c)}</button>`).join('');
  }
  $('chips').addEventListener('click',e=>{ const b=e.target.closest('[data-cat]'); if(!b) return; cat=b.dataset.cat; renderChips(); renderList(); });
  $('q').addEventListener('input',e=>{ query=e.target.value.trim().toLowerCase(); renderList(); });
  function renderList(){
    const box=$('list');
    if(!catalog){ return; }
    const groups=catalog.categories.filter(c=>cat==='전체'||c.name===cat).map(c=>({name:c.name,models:c.models.filter(m=>!query||m.name.toLowerCase().includes(query))})).filter(g=>g.models.length);
    if(!groups.length){ box.innerHTML='<div class="empty">찾는 장비가 없어요. 요청사항에 적어 주시면 확인해 드릴게요.</div>'; return; }
    box.innerHTML=groups.map(g=>`<div class="cat">${H(g.name)}</div>`+g.models.map(m=>{
      const k=keyOf({category:g.name,name:m.name}); const q=cart[k]?cart[k].qty:0; const max=Math.max(1,m.count||1);
      const ctl=q?`<div class="qty"><button type="button" data-k="${H(k)}" data-d="-1" aria-label="${H(m.name)} 빼기">−</button><output aria-live="polite">${q}</output><button type="button" data-k="${H(k)}" data-d="1" aria-label="${H(m.name)} 더하기" ${q>=max?'disabled':''}>+</button></div>`
                  :`<button type="button" class="add" data-k="${H(k)}" data-d="1">담기</button>`;
      return `<div class="item"><div class="nm"><b>${H(m.name)}</b><span>${m.price?`하루 ${won(m.price)}`:'가격 문의'}${max>1?` · 보유 ${max}대`:''}</span></div>${ctl}</div>`;
    }).join('')).join('');
  }
  $('list').addEventListener('click',e=>{
    const b=e.target.closest('[data-k]'); if(!b) return;
    const k=b.dataset.k, d=Number(b.dataset.d);
    const m=allModels().find(x=>keyOf(x)===k); if(!m) return;
    const cur=cart[k]?cart[k].qty:0; const nq=Math.max(0,Math.min(Math.max(1,m.count||1),cur+d));
    if(nq) cart[k]={category:m.category,model:m.name,price:m.price||0,qty:nq}; else delete cart[k];
    saveCart(); renderList(); renderBar();
  });

  /* ---------- 아래 줄 · 장바구니 ---------- */
  function cartItems(){
    const valid=new Set(allModels().map(keyOf));
    return Object.entries(cart).filter(([k])=>!catalog||valid.has(k)).map(([k,v])=>Object.assign({k},v));
  }
  function totals(){ const days=billDays(); const items=cartItems(); const sum=items.reduce((a,i)=>a+(i.price||0)*i.qty*days,0); return {days,items,sum,count:items.reduce((a,i)=>a+i.qty,0),unpriced:items.some(i=>!i.price)}; }
  function renderBar(){
    const t=totals();
    $('barCount').textContent=`담은 장비 ${t.count}개${t.days?` · ${t.days}일`:''}`;
    $('barTotal').textContent=t.count?(won(t.sum)+(t.unpriced?' +':'')):'0원';
    $('openCart').disabled=!t.count;
  }
  let lastFocus=null;
  function openCart(){
    lastFocus=document.activeElement;
    renderCart(); $('cartBg').classList.add('on'); document.body.style.overflow='hidden';
    try{ history.pushState({fhkCart:1},''); }catch(_){}
    setTimeout(()=>{ const f=$('cartBody').querySelector('input,button'); if(f) f.focus(); },50);
  }
  function closeCart(fromPop){ if(!$('cartBg').classList.contains('on')) return; $('cartBg').classList.remove('on'); document.body.style.overflow=''; if(!fromPop){ try{ if(history.state&&history.state.fhkCart) history.back(); }catch(_){} } if(lastFocus) lastFocus.focus(); }
  window.addEventListener('popstate',()=>closeCart(true));
  $('openCart').addEventListener('click',openCart);
  $('cartBg').addEventListener('click',e=>{ if(e.target===$('cartBg')) closeCart(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCart(); });

  let form={name:'',phone:'',type:'일반',org:'',msg:'',consent:false};
  function renderCart(){
    const t=totals();
    $('cartBody').innerHTML=`
      <h2 id="cartTitle">견적 신청</h2>
      <p class="sub">${H(fmt($('sD').value,$('sT').value))} → ${H(fmt($('eD').value,$('eT').value))} · 청구 ${t.days}일 기준</p>
      ${t.items.map(i=>`<div class="line"><span>${H(i.model)} × ${i.qty}</span><span>${i.price?won(i.price*i.qty*t.days):'가격 문의'}</span></div>`).join('')}
      <div class="total"><span>예상 금액</span><b>${won(t.sum)}${t.unpriced?' +':''}</b></div>
      <p class="note">예상 금액은 하루 가격 × 대수 × 청구 일수예요. 할인(학생·독립영화 등), 기본 구성품, 부가세에 따라 최종 견적은 달라질 수 있어요.</p>
      <div class="form">
        <div class="two">
          <label class="field">이름 *<input id="fName" autocomplete="name" maxlength="60" value="${H(form.name)}"></label>
          <label class="field">연락처 *<input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="010-0000-0000" value="${H(form.phone)}"></label>
        </div>
        <div class="two">
          <label class="field">구분<select id="fType">${['일반','학생/독립영화','법인'].map(x=>`<option${x===form.type?' selected':''}>${x}</option>`).join('')}</select></label>
          <label class="field">소속 · 작품명<input id="fOrg" maxlength="80" value="${H(form.org)}"></label>
        </div>
        <label class="field">요청사항<textarea id="fMsg" maxlength="1000" placeholder="촬영 내용, 필요한 구성품, 픽업·반납 방법 등">${H(form.msg)}</textarea></label>
        <label class="hp" aria-hidden="true">웹사이트<input id="fWeb" tabindex="-1" autocomplete="off"></label>
        <label class="consent"><input type="checkbox" id="fOk" ${form.consent?'checked':''}><span>[필수] 견적 안내를 위해 이름·연락처·소속을 수집하며, 상담이 끝난 뒤 예약으로 이어지지 않으면 1년 안에 지워요. 동의하지 않으면 신청할 수 없어요.</span></label>
        <div class="err" id="fErr" role="alert"></div>
        <button class="cta" id="fSend" type="button" style="width:100%">신청 보내기</button>
        <button class="ghost" type="button" id="fBack" style="width:100%">장비 더 담기</button>
      </div>`;
    const keep=()=>{ form={name:$('fName').value,phone:$('fPhone').value,type:$('fType').value,org:$('fOrg').value,msg:$('fMsg').value,consent:$('fOk').checked}; };
    $('cartBody').querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('input',keep));
    $('fOk').addEventListener('change',keep);
    $('fBack').onclick=()=>closeCart();
    $('fSend').onclick=send;
  }
  let sending=false;
  async function send(){
    if(sending) return;
    const err=$('fErr'); err.textContent='';
    const name=$('fName').value.trim(), phone=$('fPhone').value.trim(), digits=phone.replace(/\D/g,'');
    const t=totals();
    if(!t.count){ err.textContent='장비를 하나 이상 담아 주세요.'; return; }
    if(!datesOk()){ err.textContent='대여 날짜를 다시 확인해 주세요.'; return; }
    if(!name){ err.textContent='이름을 적어 주세요.'; $('fName').focus(); return; }
    if(digits.length<9){ err.textContent='연락 가능한 번호를 적어 주세요.'; $('fPhone').focus(); return; }
    if(!$('fOk').checked){ err.textContent='개인정보 수집에 동의해 주셔야 신청할 수 있어요.'; return; }
    const row={ name, phone, cust_type:$('fType').value, org:$('fOrg').value.trim()||null,
      start_date:$('sD').value, start_time:$('sT').value, end_date:$('eD').value, end_time:$('eT').value,
      items:t.items.map(i=>({category:i.category,model:i.model,qty:i.qty,price:i.price||0})),
      message:$('fMsg').value.trim()||null, consent:true };
    sending=true; const btn=$('fSend'); btn.disabled=true; btn.textContent='보내는 중…';
    try{
      if($('fWeb').value){ await new Promise(r=>setTimeout(r,600)); }      // 자동 스팸은 조용히 무시
      else{
        if(!client) throw new Error('연결 준비가 안 됐어요');
        const { error }=await client.from('rental_requests').insert(row);
        if(error) throw error;
      }
      cart={}; saveCart(); form={name:'',phone:'',type:'일반',org:'',msg:'',consent:false};
      $('cartBody').innerHTML=`<div class="done"><div class="big"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h2>신청을 받았어요</h2><p>${H(fmt(row.start_date,row.start_time))} → ${H(fmt(row.end_date,row.end_time))}<br>장비 ${t.count}개 · 예상 ${won(t.sum)}<br><br>일정을 확인한 뒤 <b>${H(phone)}</b>로 가능 여부와 최종 견적을 연락드릴게요.</p>
        <button class="ghost" type="button" id="fClose">닫기</button></div>`;
      $('fClose').onclick=()=>closeCart();
      renderList(); renderBar();
    }catch(e){
      err.textContent='신청을 보내지 못했어요. 잠시 뒤 다시 시도하시거나 전화로 문의해 주세요.';
      btn.disabled=false; btn.textContent='신청 보내기';
    }finally{ sending=false; }
  }

  /* ---------- 불러오기 ---------- */
  async function load(){
    try{
      if(!client) throw new Error('no client');
      const { data, error }=await client.from('public_catalog').select('data,updated_at').eq('id',CATALOG_ID).maybeSingle();
      if(error) throw error;
      if(!data||!data.data||!Array.isArray(data.data.categories)) throw new Error('empty');
      catalog=data.data;
      if(catalog.info) $('foot').innerHTML=H(catalog.info);
      renderChips(); renderList(); renderBar();
    }catch(e){
      $('list').innerHTML='<div class="empty">장비 목록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</div>';
    }
  }
  renderDates(); load();
})();
</script>
</body>
</html>
